<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン — タスク管理アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">

  <!-- ログインフォーム -->
  <form class="login-box" id="login-form" novalidate>
    <h1>タスク管理アプリ</h1>
    <p class="lead">ログインしてください</p>
    <div class="form-error" id="login-error"></div>

    <div class="field">
      <label for="login-username">ユーザー名<span class="req">必須</span></label>
      <input type="text" id="login-username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="login-password">パスワード<span class="req">必須</span></label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required>
    </div>

    <div class="dialog-actions" style="justify-content:space-between;">
      <button type="button" class="btn link" id="go-register">アカウント登録はこちら</button>
      <button type="submit" class="btn primary">ログイン</button>
    </div>
  </form>

  <!-- アカウント登録フォーム -->
  <form class="login-box" id="register-form" novalidate hidden>
    <h1>アカウント登録</h1>
    <p class="lead">初めて利用する場合はこちら</p>
    <div class="form-error" id="register-error"></div>

    <div class="field">
      <label for="register-username">ユーザー名<span class="req">必須</span></label>
      <input type="text" id="register-username" name="username" autocomplete="username" required>
      <div class="hint">他の人と重複しない名前</div>
    </div>
    <div class="field">
      <label for="register-password">パスワード<span class="req">必須</span></label>
      <input type="password" id="register-password" name="password" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="register-password2">パスワード(確認)<span class="req">必須</span></label>
      <input type="password" id="register-password2" name="password2" autocomplete="new-password" required>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn" id="go-login">ログインに戻る</button>
      <button type="submit" class="btn primary">登録する</button>
    </div>
  </form>

</div>
<script src="script.js"></script>
</body>
</html>
