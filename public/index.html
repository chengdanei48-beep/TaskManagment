<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク管理アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>タスク管理アプリ</h1>
  <div class="user-info">
    <span><strong id="current-username"></strong> さんでログイン中</span>
    <button class="btn" id="logout-btn">ログアウト</button>
  </div>
</header>

<main>
  <div class="board" id="board">
    <!-- 列(カラム)はJavaScriptで描画 -->
  </div>
</main>

<!-- カード追加・編集ダイアログ -->
<dialog id="card-dialog">
  <form method="dialog" id="card-form" novalidate>
    <h3 id="card-dialog-title">タスクを追加</h3>

    <div class="field" id="card-title-field">
      <label for="card-title">タイトル<span class="req">必須</span></label>
      <input type="text" id="card-title" name="title" maxlength="50" required>
      <div class="hint">1〜50文字</div>
      <div class="error">タイトルを入力してください(1〜50文字)。</div>
    </div>

    <div class="field" id="card-description-field">
      <label for="card-description">詳細説明文</label>
      <textarea id="card-description" name="description" maxlength="500"></textarea>
      <div class="hint">500文字まで(任意)</div>
      <div class="error">詳細説明文は500文字までです。</div>
    </div>

    <div class="field">
      <label for="card-due-date">期限日</label>
      <input type="date" id="card-due-date" name="dueDate">
      <div class="hint">任意</div>
    </div>

    <div class="field">
      <label id="card-priority-label">重要度</label>
      <div class="priority-picker" role="radiogroup" aria-labelledby="card-priority-label">
        <button type="button" class="priority-option" data-priority="">なし</button>
        <button type="button" class="priority-option priority-low" data-priority="low">低</button>
        <button type="button" class="priority-option priority-medium" data-priority="medium">中</button>
        <button type="button" class="priority-option priority-high" data-priority="high">重</button>
      </div>
      <input type="hidden" id="card-priority" name="priority" value="">
    </div>

    <div class="hint" id="card-created-at" style="margin-bottom:8px;"></div>

    <div class="dialog-actions">
      <button type="button" class="btn danger" id="card-delete-btn" hidden>削除</button>
      <button type="button" class="btn" id="card-cancel-btn">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<!-- 列追加ダイアログ -->
<dialog id="column-dialog">
  <form method="dialog" id="column-form" novalidate>
    <h3>列を追加</h3>
    <div class="field" id="column-name-field">
      <label for="column-name">列名<span class="req">必須</span></label>
      <input type="text" id="column-name" name="name" maxlength="20" required>
      <div class="hint">1〜20文字。列数は最大10列</div>
      <div class="error">列名を入力してください(1〜20文字)。</div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="column-cancel-btn">キャンセル</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<!-- カード削除確認ダイアログ -->
<dialog id="card-delete-dialog">
  <h3>カードを削除しますか?</h3>
  <p id="card-delete-message" style="font-size:13px;margin:0;"></p>
  <div class="dialog-actions">
    <button type="button" class="btn" id="card-delete-cancel-btn">キャンセル</button>
    <button type="button" class="btn danger" id="card-delete-confirm-btn">削除する</button>
  </div>
</dialog>

<!-- 列削除確認ダイアログ -->
<dialog id="column-delete-dialog">
  <h3>列を削除しますか?</h3>
  <p id="column-delete-message" style="font-size:13px;margin:0;"></p>
  <div class="dialog-actions">
    <button type="button" class="btn" id="column-delete-cancel-btn">キャンセル</button>
    <button type="button" class="btn danger" id="column-delete-confirm-btn">削除する</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
