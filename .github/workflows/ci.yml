name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spotless / Checkstyle / SpotBugs / Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskmanagement
          POSTGRES_USER: taskmanagement
          POSTGRES_PASSWORD: taskmanagement_dev_pw
        # application.properties の既定ポート(5433)に合わせる
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taskmanagement -d taskmanagement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # verify = テスト + Spotless(整形) + Checkstyle + SpotBugs
      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Lint / Typecheck / Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
