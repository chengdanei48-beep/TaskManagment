name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spotless / Checkstyle / SpotBugs / Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskmanagement
          POSTGRES_USER: taskmanagement
          POSTGRES_PASSWORD: taskmanagement_dev_pw
        # application.properties の既定ポート(5433)に合わせる
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taskmanagement -d taskmanagement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # verify = テスト + Spotless(整形) + Checkstyle + SpotBugs
      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Lint / Typecheck / Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build

  terraform:
    name: Terraform (Format / Validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.16"
      # AWS の認証は使わない(backend なし・plan はしない)。構文と整形だけを確認する
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -input=false -backend=false
      - name: Validate
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v6
      - name: TFLint init
        run: tflint --init
        env:
          # プラグイン(AWS ルールセット)の取得で GitHub API の制限に当たらないようにする
          GITHUB_TOKEN: ${{ github.token }}
      - name: TFLint
        run: tflint --format compact
      # MEDIUM 以上を失敗にする。意図した設定は .tf に `#trivy:ignore:AWS-xxxx` と理由を書いて除外する
      - name: Trivy (misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "1"
          format: table

  powershell:
    name: PowerShell (PSScriptAnalyzer)
    # 運用スクリプトは Windows PowerShell 5.1 で実行するため、Windows で解析する
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Analyze
        shell: powershell
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts -Settings scripts/PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results) { exit 1 }
