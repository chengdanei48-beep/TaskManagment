# 開発用プロファイル(dev)。./mvnw spring-boot:run とテストで自動的に有効になる。
# 通常のマイグレーションに加えて、開発用のseedデータ(demo_user とサンプルカード)を投入する。
# 注意: db/migration と db/seed でバージョン番号(V2 など)が重複しないようにすること。
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# 開発時のみ: 実行SQLの表示と、health の詳細表示
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoint.health.show-details=always
