spring.application.name=backend
server.port=8080
# PCの外からはアクセスできないようにする(要件 6.4)。変更する場合は環境変数 SERVER_ADDRESS で上書きできる
server.address=127.0.0.1

# セッションCookie(JSから読めない・他サイトからの送信を制限)とタイムアウト
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Datasource (matches docker-compose/.env.example defaults; override via env vars for non-default local setups)
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:taskmanagement}
spring.datasource.username=${DB_USER:taskmanagement}
spring.datasource.password=${DB_PASSWORD:taskmanagement_dev_pw}

# JPA / Hibernate (schema is managed by Flyway migrations; Hibernate only validates it matches the entities)
spring.jpa.hibernate.ddl-auto=validate
# ビュー描画までDB接続を保持しない(遅延ロードは Service のトランザクション内で完結させる)
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration

# Actuator - health のみ公開。詳細(DB接続状況など)は認証済みの場合のみ表示する
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
